<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乘风九九岛</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Arial Rounded MT Bold","PingFang SC",sans-serif;color:#24506b;background:#75dcf5}button,input{font:inherit}button{cursor:pointer}.hide{display:none!important}
#home{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(#168cc52b,#0f70973d),url('assets/math-island-scroll.png') center/cover}.homebox{width:min(720px,100%);text-align:center}.logo{color:#fff;font-size:clamp(42px,8vw,72px);margin:0 0 12px;text-shadow:0 5px #147ea4,0 10px 20px #0b5268}.card{background:#fffdf0e9;border:5px solid #fff;border-radius:30px;padding:18px 24px;box-shadow:0 10px #176c8c55}.steps,.avatars,.modes,.actions{display:grid;gap:9px}.steps{grid-template-columns:repeat(3,1fr)}.steps span{background:#e8faff;padding:10px 4px;border-radius:14px;font-weight:900}.steps b{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#48c6d7;color:#fff;margin-right:4px}.label{font-weight:900;margin:14px 0 7px}.name{width:100%;padding:12px;text-align:center;border:3px solid #b8e7ec;border-radius:14px}.avatars{grid-template-columns:repeat(4,1fr)}.avatar{border:3px solid #d5e8e5;background:#fff;border-radius:18px;padding:5px;color:#24506b}.avatar img{width:100%;border-radius:13px;display:block}.avatar.on{border-color:#ffad35;box-shadow:0 4px #ffd07b}.modes{grid-template-columns:1fr 1fr}.mode{padding:12px;border:3px solid #d8e9df;border-radius:16px;background:#fff}.mode.on{border-color:#54c987;background:#effff4}.actions{grid-template-columns:1fr 150px;margin-top:16px}.start,.rankbtn{border:0;border-radius:17px;padding:15px;font-weight:900}.start{background:#ff9d35;color:#fff;box-shadow:0 5px #d76b25;font-size:20px}.rankbtn{background:#fff1a9;color:#95631c;box-shadow:0 5px #ca9132}
#game{height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.hud{display:flex;align-items:center;gap:10px;padding:9px 3vw;background:#fffdf2;border-bottom:5px solid #ffd763;z-index:5}.hud img{width:42px;height:42px;border-radius:50%}.hud .push{margin-left:auto}.chip{padding:8px 12px;border-radius:18px;background:#eaf8fb}.world{position:relative;overflow:hidden;background:#68d6f2}.track{position:absolute;inset:0;width:6000vw;display:flex;transition:transform 1s ease}.seg{width:130vw;flex:none;background:center/cover}.seg:nth-child(odd){background-image:url('assets/math-island-scroll.png')}.seg:nth-child(even){background-image:url('assets/math-island-scroll-extension.png')}.question{position:absolute;z-index:3;top:4%;left:50%;transform:translateX(-50%);background:#fffdf0;border:5px solid #fff;border-radius:22px;padding:8px 35px;text-align:center;box-shadow:0 6px #dda63d}.question b{display:block;font-size:34px}.answer{position:absolute;z-index:4;text-align:center;transition:.15s}.answer small{display:block;background:#267fa4;color:#fff;border:2px solid #fff;border-radius:10px;padding:2px}.answer b{display:block;margin-top:3px;background:#fff8cc;border:4px solid #fff;border-radius:14px;padding:5px 16px;font-size:30px;box-shadow:0 5px #d58d2e}.near{left:24%;top:68%}.mid{left:65%;top:51%}.far{left:48%;top:31%}.answer.aim b{transform:scale(1.18);background:#fff06b;box-shadow:0 0 0 8px #fff36b66,0 6px #d58d2e}.runner{position:absolute;z-index:5;left:8%;bottom:8%;width:100px;height:100px;border:5px solid #fff;border-radius:50%;overflow:hidden;background:#fff}.runner img{width:100%;height:100%;object-fit:cover}.runner.charge{animation:bob .3s infinite alternate}.runner.jump{animation:jump 1.1s}.feedback{position:absolute;z-index:8;top:22%;left:50%;transform:translateX(-50%);padding:11px 20px;border:4px solid #fff;border-radius:18px;background:#39c875;color:#fff;font-weight:900}.feedback.bad{background:#ff7955}.control{display:grid;grid-template-columns:1fr minmax(280px,420px) 1fr;gap:20px;align-items:center;padding:13px 5vw;background:#fffdf2;border-top:5px solid #ffd763}.bar{height:18px;border-radius:12px;background:#dbe9e8;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fda88,#ffe052,#ff8039)}#charge{border:0;border-radius:16px;padding:15px;background:#ff9635;color:#fff;font-weight:900;box-shadow:0 5px #d56825;touch-action:none}.rankfloat{position:absolute;right:15px;bottom:100px;z-index:9}
.overlay{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:15px;background:#123e5a99}.modal{width:min(720px,100%);max-height:82vh;overflow:auto;background:#fffdf0;border:5px solid #fff;border-radius:26px;padding:20px;text-align:center}.close{float:right;border:0;border-radius:50%;background:#ff7964;color:#fff;font-size:24px}.row{display:grid;grid-template-columns:45px 1fr 60px 70px 60px;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #dbe8e5;text-align:left}.row img{width:38px;height:38px;border-radius:50%}@keyframes bob{to{transform:translateY(8px) scale(.95)}}@keyframes jump{50%{transform:translate(38vw,-35vh) scale(.8)}}
@media(max-width:600px){.card{padding:13px 10px}.steps span{font-size:11px}.actions{grid-template-columns:1fr 110px}.control{grid-template-columns:1fr}.control>span,.control>div:first-child{display:none}.hud{font-size:12px}.question b{font-size:27px}.runner{width:78px;height:78px}.answer b{font-size:23px}.mid{left:68%}.near{left:8%}}
</style></head><body>
<main id="home"><div class="homebox"><h1 class="logo">乘风九九岛</h1><section class="card"><div class="steps"><span><b>1</b>心里算一算</span><span><b>2</b>找答案岛</span><span><b>3</b>按住，跳！</span></div><div class="label">探险家，你叫什么？</div><input id="name" class="name" maxlength="10" placeholder="输入你的名字"><div class="label">选择你的冒险伙伴</div><div id="avatars" class="avatars"></div><div class="label">挑选冒险难度</div><div class="modes"><button class="mode on" data-mode="normal">🌱 普通模式<br><small>2～9 的乘法</small></button><button class="mode" data-mode="advanced">🔥 进阶模式<br><small>11～19 的乘法</small></button></div><div class="actions"><button id="start" class="start">开始闯岛 ➜</button><button class="rankbtn" data-rank>🏆 排行榜</button></div></section></div></main>
<main id="game" class="hide"><header class="hud"><button id="back">←</button><img id="hudAvatar"><b id="hudName"></b><span class="chip push" id="level">第 1 关</span><span class="chip" id="timer">⏱ 00:00</span><span class="chip" id="score">⭐ 0</span><span class="chip" id="lives">❤️❤️❤️</span></header><section class="world"><div id="track" class="track"></div><div class="question"><small id="modeLabel"></small><b id="question"></b></div><div id="feedback" class="feedback hide"></div><div class="answer far" data-target="far"><small>远岛</small><b></b></div><div class="answer mid" data-target="mid"><small>中岛</small><b></b></div><div class="answer near" data-target="near"><small>近岛</small><b></b></div><div id="runner" class="runner"><img></div><button class="rankbtn rankfloat" data-rank>🏆 排行榜</button></section><footer class="control"><div><small id="powerText">跳跃能量 0%</small><div class="bar"><i id="bar"></i></div></div><button id="charge">按住鼠标、手指或空格蓄力</button><span>蓄力越久，跳得越远！</span></footer></main>
<div id="overlay" class="overlay hide"><section class="modal"><button id="close" class="close">×</button><h2>🏆 本地探险榜</h2><p>分数高的排前面，同分时用时更短的优先</p><div id="ranking"></div></section></div>
<script>
const heroes=[['星宝','xingbao.png'],['芽芽','yaya.png'],['阳阳','yangyang.png'],['云朵','yunduo.png']];let hero=0,mode='normal',q,power=0,charging=false,timerId,elapsed=0,startAt=0,score=0,lives=3,level=1,progress=0,locked=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
$('#avatars').innerHTML=heroes.map((h,i)=>`<button class="avatar ${i?'':'on'}" data-i="${i}"><img src="assets/avatars/${h[1]}"><b>${h[0]}</b></button>`).join('');$('#track').innerHTML=Array.from({length:40},()=>'<i class="seg"></i>').join('');
$('#avatars').onclick=e=>{let b=e.target.closest('.avatar');if(!b)return;hero=+b.dataset.i;$$('.avatar').forEach(x=>x.classList.toggle('on',x===b))};$$('.mode').forEach(b=>b.onclick=()=>{$$('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode});
function newQ(){let min=mode==='normal'?2:11,max=mode==='normal'?9:19,a=min+Math.random()*(max-min+1)|0,b=min+Math.random()*(max-min+1)|0,c=a*b,o=[c];while(o.length<3){let n=c+(Math.random()*11|0)-5;if(n>0&&!o.includes(n))o.push(n)}o.sort(()=>Math.random()-.5);q={a,b,c,near:o[0],mid:o[1],far:o[2]};$('#question').textContent=`${a} × ${b} = ?`;$$('.answer').forEach(x=>x.querySelector('b').textContent=q[x.dataset.target])}
function start(){score=0;lives=3;level=1;progress=0;elapsed=0;startAt=Date.now();$('#home').classList.add('hide');$('#game').classList.remove('hide');$('#hudAvatar').src=$('#runner img').src=`assets/avatars/${heroes[hero][1]}`;$('#hudName').textContent=$('#name').value.trim()||heroes[hero][0];$('#modeLabel').textContent=mode==='normal'?'普通冒险 · 2—9 乘法':'进阶冒险 · 11—19 乘法';update();newQ();clearInterval(timerId);timerId=setInterval(()=>{elapsed=(Date.now()-startAt)/1000|0;$('#timer').textContent='⏱ '+fmt(elapsed)},250)}
function update(){$('#score').textContent='⭐ '+score;$('#lives').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);$('#level').textContent='第 '+level+' 关'}
function begin(){if(charging||locked||!lives)return;charging=true;$('#runner').classList.add('charge');timerIdCharge=setInterval(()=>{power=Math.min(100,power+2);let t=power<34?'near':power<67?'mid':'far';$$('.answer').forEach(x=>x.classList.toggle('aim',x.dataset.target===t));$('#bar').style.width=power+'%';$('#powerText').textContent='跳跃能量 '+power+'%'},24)}
function release(){if(!charging)return;charging=false;locked=true;clearInterval(timerIdCharge);$('#runner').classList.remove('charge');$('#runner').classList.add('jump');let t=power<34?'near':power<67?'mid':'far',ok=q[t]===q.c;$('#feedback').className='feedback '+(ok?'':'bad');$('#feedback').textContent=ok?'🌟 答对啦！继续向前！':'💡 答错了，正确答案是 '+q.c;if(ok){score+=100;level++;progress++;$('#track').style.transform=`translateX(${-progress*62}vw)`}else lives--;update();setTimeout(()=>{$('#runner').classList.remove('jump');$('#feedback').classList.add('hide');$$('.answer').forEach(x=>x.classList.remove('aim'));power=0;$('#bar').style.width=0;locked=false;if(!lives)end();else newQ()},1200)}
function end(){clearInterval(timerId);let rows=JSON.parse(localStorage.getItem('chengfeng-html-rank')||'[]');rows.push({name:$('#hudName').textContent,hero,score,time:elapsed,mode,id:Date.now()});rows.sort((a,b)=>b.score-a.score||a.time-b.time);localStorage.setItem('chengfeng-html-rank',JSON.stringify(rows.slice(0,50)));showRank()}
function showRank(){let rows=JSON.parse(localStorage.getItem('chengfeng-html-rank')||'[]');$('#ranking').innerHTML=rows.length?rows.map((r,i)=>`<div class="row"><b>${i<3?['🥇','🥈','🥉'][i]:i+1}</b><span><img src="assets/avatars/${heroes[r.hero][1]}"> ${r.name}</span><span>${r.mode==='normal'?'普通':'进阶'}</span><b>${r.score}⭐</b><span>${fmt(r.time)}</span></div>`).join(''):'还没有成绩，快去闯岛吧！';$('#overlay').classList.remove('hide')}
$('#start').onclick=start;$('#back').onclick=()=>{clearInterval(timerId);$('#game').classList.add('hide');$('#home').classList.remove('hide')};$('#charge').onpointerdown=begin;$('#charge').onpointerup=release;$('#charge').onpointercancel=release;window.onkeydown=e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();begin()}};window.onkeyup=e=>{if(e.code==='Space'){e.preventDefault();release()}};$$('[data-rank]').forEach(b=>b.onclick=showRank);$('#close').onclick=()=>$('#overlay').classList.add('hide');$('#overlay').onmousedown=e=>{if(e.target===e.currentTarget)$('#overlay').classList.add('hide')};
</script></body></html>
